
name: Build Vagon Boshqaruvi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Kodlarni yuklash
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle ruxsatini berish
        run: chmod +x gradlew

      - name: APK yaratish
        run: ./gradlew assembleDebug

      - name: APK yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Vagon-Boshqaruvi-APK
          path: app/build/outputs/apk/debug/*.apk
