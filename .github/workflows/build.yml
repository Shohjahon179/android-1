
name: Build Vagon Boshqaruvi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlarni yuklash
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Wrapper yaratish
        run: gradle wrapper --gradle-version 8.6

      - name: APK yaratish
        run: ./gradlew assembleDebug

      - name: APK saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Vagon-Boshqaruvi-APK
          path: app/build/outputs/apk/debug/*.apk
